name: Build and publish Docker image

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      ipscan_version:
        description: "Version d'Angry IP Scanner (latest ou version précise)"
        required: true
        default: "latest"
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Déterminer la version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.ipscan_version }}"
          else
            VERSION="latest"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version demandée : ${VERSION}"

      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build et publication
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true

          build-args: |
            IPSCAN_VERSION=${{ steps.version.outputs.version }}

          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
